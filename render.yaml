# Render Blueprint Specification for NAFLD Fibrosis Risk Estimation
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nafld-fibrosis-app
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements-render.txt"
    startCommand: "uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
